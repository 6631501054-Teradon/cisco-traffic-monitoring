<!DOCTYPE html>
<html>
<head>
    <title>Cisco Traffic Monitoring</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <h1>Real-time Traffic Monitoring</h1>
    <div id="data">Waiting for data...</div>
    <script>
        var socket = io();
        socket.on('traffic_data', function(data) {
            document.getElementById('data').innerHTML = 
                'Bytes Sent: ' + data.bytes_sent + ' | Bytes Recv: ' + data.bytes_recv;
        });
    </script>
</body>
</html>
